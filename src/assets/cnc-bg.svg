<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#0f0f0f"/>
    </linearGradient>
    <filter id="grain" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" result="t"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="t" mode="overlay"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#g)"/>
  <!-- stylized CNC silhouette -->
  <g fill="#0b0b0b" opacity="0.95">
    <rect x="80" y="160" width="1100" height="420" rx="8"/>
    <rect x="260" y="80" width="380" height="120" rx="6"/>
    <rect x="740" y="80" width="300" height="120" rx="6"/>
  </g>
  <!-- precision cut detail lines -->
  <g stroke="#c9a84a" stroke-opacity="0.12" stroke-width="2">
    <path d="M220 420 L1400 420"/>
    <path d="M220 460 L1400 460"/>
    <path d="M220 500 L1400 500"/>
  </g>
  <!-- subtle dust particles -->
  <g fill="#ffffff" opacity="0.06">
    <circle cx="420" cy="360" r="2"/>
    <circle cx="520" cy="290" r="1.5"/>
    <circle cx="820" cy="420" r="1.8"/>
    <circle cx="1100" cy="360" r="1.2"/>
    <circle cx="1350" cy="460" r="1.6"/>
  </g>
  <rect width="100%" height="100%" fill="black" opacity="0.18"/>
  <g filter="url(#grain)" opacity="0.06"><rect width="100%" height="100%" fill="#000"/></g>
</svg>
